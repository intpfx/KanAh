name: Android APK release

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing main tag to rebuild
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ (github.event_name == 'push' && !github.event.deleted) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require a commit in main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platforms;android-36 build-tools;35.0.0

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build and verify signed APK
        env:
          LIVE_KEYSTORE_BASE64: ${{ secrets.LIVE_KEYSTORE_BASE64 }}
          LIVE_KEY_ALIAS: ${{ secrets.LIVE_KEY_ALIAS }}
          LIVE_STORE_PASSWORD: ${{ secrets.LIVE_STORE_PASSWORD }}
          LIVE_KEY_PASSWORD: ${{ secrets.LIVE_KEY_PASSWORD }}
          LIVE_CERTIFICATE_SHA256: ${{ vars.LIVE_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          : "${LIVE_KEYSTORE_BASE64:?Missing LIVE_KEYSTORE_BASE64 secret}"
          : "${LIVE_KEY_ALIAS:?Missing LIVE_KEY_ALIAS secret}"
          : "${LIVE_STORE_PASSWORD:?Missing LIVE_STORE_PASSWORD secret}"
          : "${LIVE_KEY_PASSWORD:?Missing LIVE_KEY_PASSWORD secret}"
          [[ "$LIVE_CERTIFICATE_SHA256" =~ ^[[:xdigit:]]{64}$ ]] || {
            echo "::error::Set LIVE_CERTIFICATE_SHA256 to the expected APK signer fingerprint."
            exit 1
          }
          umask 077
          export LIVE_KEYSTORE
          LIVE_KEYSTORE=$(mktemp "$RUNNER_TEMP/kanah-signing.XXXXXXXX")
          trap 'rm -f "$LIVE_KEYSTORE"' EXIT
          printf '%s' "$LIVE_KEYSTORE_BASE64" | base64 --decode > "$LIVE_KEYSTORE"
          unset LIVE_KEYSTORE_BASE64
          ./gradlew --no-configuration-cache :app:assembleRelease :app:lintRelease

          output=app/build/outputs/apk/release
          version=$(jq -er '.elements[0].versionName' "$output/output-metadata.json")
          code=$(jq -er '.elements[0].versionCode' "$output/output-metadata.json")
          mkdir -p release
          cp "$output/app-release.apk" release/KanAh.apk
          python3 scripts/verify_release.py release/KanAh.apk \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" \
            --version "$version" --minimum-code "$code" \
            --certificate "$LIVE_CERTIFICATE_SHA256"
          (cd release && sha256sum KanAh.apk > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if draft=$(gh release view --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft -- "$TAG"); then
            if [[ "$draft" == false ]]; then
              echo 'This tag already has a published release.'
              exit 0
            fi
            gh release upload --repo "$GITHUB_REPOSITORY" --clobber \
              -- "$TAG" release/KanAh.apk release/SHA256SUMS.txt
            gh release edit --repo "$GITHUB_REPOSITORY" --draft=false -- "$TAG"
          else
            gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              -- "$TAG" release/KanAh.apk release/SHA256SUMS.txt
          fi
